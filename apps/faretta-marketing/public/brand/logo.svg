<?xml version="1.0" encoding="UTF-8"?>
<!--
  Faretta mark — scales of justice with a small flame at the fulcrum.
  Reads as a balanced scale at small sizes; the flame implies the right
  to stand and speak for yourself. Patriotic tricolor accents.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="frt-flame" x1="32" y1="6" x2="32" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B91C1C"/>
      <stop offset="0.55" stop-color="#C8941A"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="frt-bar" x1="10" y1="32" x2="54" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="0.5" stop-color="#C8941A"/>
      <stop offset="1" stop-color="#B91C1C"/>
    </linearGradient>
  </defs>

  <!-- Standing column -->
  <rect x="30.5" y="22" width="3" height="32" rx="1" fill="#1E3A8A"/>
  <!-- Base -->
  <rect x="22" y="54" width="20" height="3" rx="1.2" fill="#1A2332"/>
  <rect x="20" y="56" width="24" height="2" rx="1" fill="#1A2332"/>

  <!-- Crossbar -->
  <rect x="10" y="22" width="44" height="2.4" rx="1.2" fill="url(#frt-bar)"/>

  <!-- Left pan -->
  <path d="M10 22 L6 30 L18 30 Z" fill="#1E3A8A" opacity="0.85"/>
  <path d="M6 30 Q12 32 18 30" stroke="#1E3A8A" stroke-width="1.2" fill="none"/>
  <line x1="12" y1="22" x2="12" y2="22" stroke="#1E3A8A" stroke-width="1"/>
  <line x1="12" y1="22" x2="12" y2="22"/>

  <!-- Right pan -->
  <path d="M54 22 L50 30 L58 30 Z" fill="#B91C1C" opacity="0.85"/>
  <path d="M50 30 Q54 32 58 30" stroke="#B91C1C" stroke-width="1.2" fill="none"/>

  <!-- Flame at fulcrum (above crossbar) -->
  <path d="M32 6
           C 30 12, 28 14, 30 18
           C 28 16, 28 14, 27 17
           C 26 21, 30 24, 32 24
           C 34 24, 38 21, 37 17
           C 36 14, 36 16, 34 18
           C 36 14, 34 12, 32 6 Z"
        fill="url(#frt-flame)"/>
  <!-- Inner highlight on flame -->
  <path d="M32 10 C 31 14, 31 16, 32 19 C 33 16, 33 14, 32 10 Z"
        fill="#FBF7EE" opacity="0.75"/>
</svg>
